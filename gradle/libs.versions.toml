[versions]
androidGradlePlugin = "9.4.1"
appcompat = "1.8.0"
coreKtx = "1.19.1"
credentials = "1.6.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"
logbackAndroid = "3.0.0"
material = "1.14.0"
yubikit = "3.3.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logbackAndroid" }
material = { module = "com.google.android.material:material", version.ref = "material" }
yubikit-android = { module = "com.yubico.yubikit:android", version.ref = "yubikit" }
yubikit-fido = { module = "com.yubico.yubikit:fido", version.ref = "yubikit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
